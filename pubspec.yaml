name: entre_sales
description: Inventory, POS, artist invoicing and reporting for Entre concept store.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (no code generation needed)
  flutter_riverpod: ^2.6.1

  # Local SQLite database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4 # SQLite on Windows (for testing on a computer)
  path: ^1.9.0
  path_provider: ^2.1.5

  # Formatting
  intl: ^0.20.2

  # PDF invoices / reports and sharing exported files
  pdf: ^3.11.3
  share_plus: ^10.1.4

  # Charts for reports
  fl_chart: ^0.70.2

  # Google Calendar (workshop sessions)
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Lato-Regular.ttf
    - assets/fonts/Lato-Bold.ttf

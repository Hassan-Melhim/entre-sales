name: entre_sales
description: Inventory, POS, artist invoicing and reporting for Entre Salas concept store (website).
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (no code generation needed)
  flutter_riverpod: ^2.6.1

  # Shared online database and sign-in
  supabase_flutter: ^2.13.0

  # Per-device preferences (light / dark mode, auto sign-out)
  shared_preferences: ^2.3.0

  # Formatting
  intl: ^0.20.2

  # PDF invoices / reports
  pdf: ^3.11.3

  # Browser downloads
  web: ^1.1.0

  # Charts for reports
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Lato-Regular.ttf
    - assets/fonts/Lato-Bold.ttf
